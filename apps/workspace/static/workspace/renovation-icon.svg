<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="t d">
  <title id="t">Ремонт квартир</title>
  <desc id="d">Иконка: дом с валиком для покраски и гаечным ключом</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F07A1A"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EEE8"/>
    </linearGradient>
    <linearGradient id="roller" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3F7"/>
      <stop offset="1" stop-color="#1F6FD1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#7A3A00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"/>

  <!-- Дом -->
  <g filter="url(#sh)">
    <path d="M6 15.2 L16 7 L26 15.2" fill="none" stroke="#3A2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.5 14.2 V25 H23.5 V14.2 L16 8.2 Z" fill="url(#wall)" stroke="#3A2A1E" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="20.6" y="8.4" width="2" height="3.6" fill="#3A2A1E"/>
    <!-- Окно -->
    <rect x="10.6" y="15.6" width="4.4" height="4" rx="0.6" fill="#BFE0FF" stroke="#3A2A1E" stroke-width="0.8"/>
    <path d="M12.8 15.6 V19.6 M10.6 17.6 H15" stroke="#3A2A1E" stroke-width="0.6"/>
    <!-- Дверь -->
    <rect x="17.4" y="18" width="3.8" height="7" rx="0.5" fill="#B5652A" stroke="#3A2A1E" stroke-width="0.8"/>
    <circle cx="20.3" cy="21.7" r="0.4" fill="#FFD27A"/>
    <!-- Свежая краска на стене -->
    <path d="M9.2 22.4 Q11 21.6 12.8 22.4 T16.4 22.4 V24.4 H9.2 Z" fill="#4FA3F7" opacity="0.55"/>
  </g>

  <!-- Валик -->
  <g filter="url(#sh)" transform="rotate(-18 24 24)">
    <rect x="19.6" y="19.8" width="8.4" height="3.4" rx="1.4" fill="url(#roller)" stroke="#123E73" stroke-width="0.7"/>
    <path d="M20.6 20.7 H27" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M28 21.5 H29.4 V25.2 H23.8 V27" fill="none" stroke="#3A2A1E" stroke-width="0.9" stroke-linejoin="round"/>
    <rect x="22.9" y="26.6" width="1.8" height="3.6" rx="0.8" fill="#3A2A1E"/>
  </g>

  <!-- Гаечный ключ -->
  <g filter="url(#sh)" transform="rotate(40 7 8)">
    <rect x="6.3" y="4.6" width="1.6" height="7.2" rx="0.8" fill="#E8EDF2" stroke="#3A2A1E" stroke-width="0.7"/>
    <path d="M5 4.8 A2.2 2.2 0 1 1 9.2 4.8 L8.2 4.8 L8.2 3.4 L6 3.4 L6 4.8 Z" fill="#E8EDF2" stroke="#3A2A1E" stroke-width="0.7" stroke-linejoin="round"/>
  </g>

  <!-- Капли краски -->
  <circle cx="27.4" cy="12.6" r="0.9" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="25.6" cy="10.4" r="0.55" fill="#FFFFFF" opacity="0.7"/>
</svg>
